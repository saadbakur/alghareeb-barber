<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صالون الغريب</title>
<meta name="description" content="صالون الغريب للحلاقة الرجالية في إدلب: قص شعر، حلاقة دقن، تنظيف بشرة، وحلاقة عريس. احجز موعدك عبر واتساب.">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--surface:#fff;--text:#231f1a;--muted:#7a7166;--gold:#b8893b;--gold-soft:#f3e9d6;--border:#ebe3d6;--hero:#231f1a;--herotext:#fbf8f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15130f;--surface:#1e1b16;--text:#f3ede2;--muted:#a89f90;--gold:#d9a94f;--gold-soft:#2c2619;--border:#2d2920;--hero:#0e0c09;--herotext:#f3ede2}}
:root[data-theme="dark"]{--bg:#15130f;--surface:#1e1b16;--text:#f3ede2;--muted:#a89f90;--gold:#d9a94f;--gold-soft:#2c2619;--border:#2d2920;--hero:#0e0c09;--herotext:#f3ede2}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;line-height:1.8}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.hero{background:var(--hero);color:var(--herotext);text-align:center;padding:72px 18px 64px}
.hero .ic{font-size:3rem}
.hero h1{font-size:clamp(2rem,7vw,3.2rem);margin:6px 0;font-weight:800}
.hero p{color:var(--gold);font-size:1.15rem;margin:0 0 24px}
.btn{display:inline-block;background:var(--gold);color:#1a1510;border:none;padding:12px 30px;border-radius:999px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
section{padding:44px 0}
h2{text-align:center;font-size:1.6rem;margin:0 0 6px}
.line{width:48px;height:3px;background:var(--gold);margin:0 auto 24px;border-radius:2px}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.s{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.s b{display:block}
.s small{color:var(--muted)}
.price{color:var(--gold);font-weight:800;white-space:nowrap}
.alt{background:var(--gold-soft)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;text-align:center}
.info div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.info .e{font-size:1.6rem}
.book{max-width:440px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;display:grid;gap:10px}
.book input,.book select{padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;width:100%}
.book .btn{width:100%;text-align:center}
footer{text-align:center;color:var(--muted);padding:24px 0 90px;font-size:.9rem}
.wa{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:10}
.logo{width:170px;height:170px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 28px rgba(217,169,79,.35);margin-bottom:8px}
:root:root:root{--bg:#0f0e0c;--surface:#1a1814;--text:#f3ede2;--muted:#a89f90;--gold:#d9a94f;--gold-soft:#1b1710;--border:#2d2920;--hero:#000;--herotext:#f3ede2;color-scheme:dark}
.hint{color:var(--muted);font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:9px 0;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer;direction:ltr}
.slot.on{background:var(--gold);color:#1a1510;border-color:var(--gold);font-weight:700}
.slot.off{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.done{display:none;text-align:center;border:1px solid var(--gold);border-radius:12px;padding:12px}
.done a{display:inline-block;margin-top:8px;background:#25d366;color:#fff;padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:700}
</style>
</head>

<h1 id="name"></h1>
<p id="tag"></p>
<a class="btn" href="#book">احجز موعدك</a>
</div>

<section><div class="wrap">
<h2>خدماتنا</h2><div class="line"></div>
<div class="svc" id="svc"></div>
</div></section>

<section class="alt"><div class="wrap">
<h2>معلومات التواصل</h2><div class="line"></div>
<div class="info">
<div><div class="e">🕒</div><b>ساعات العمل</b><br><span id="hours"></span></div>
<div><div class="e">📍</div><b>العنوان</b><br><span id="addr"></span></div>
<div><div class="e">📞</div><b>الهاتف</b><br><span id="ph" style="direction:ltr;display:inline-block"></span></div>
</div>
</div></section>

<section id="book"><div class="wrap">
<h2>احجز موعدك</h2><div class="line"></div>
<div class="book">
<input id="n" placeholder="اسمك">
<select id="sv"></select>
<input type="date" id="d">
<div class="hint">اختر الوقت (الرمادي ممتلئ أو انتهى)</div>
<div class="slots" id="slots"></div>
<button class="btn" id="go">احجز</button>
<div class="done" id="done"></div>
</div>
</div></section>

<footer id="foot"></footer>
<a class="wa" id="wa" target="_blank" rel="noopener" aria-label="واتساب">💬</a>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== عدّل هذا القسم فقط لكل زبون ===== */
var CONFIG={
  name:"صالون الغريب",
  tagline:"للحلاقة الرجالية · Barber Shop",
  phone:"994400803871",
  phoneShow:"+994 40 080 38 71",
  address:"إدلب، دوار الساعة المالية القديمة، مقابل الدكتورة نهى مبيض",
  hours:"من 9 صباحاً حتى 12 منتصف الليل",
  services:[
    {n:"قص شعر",d:"",p:"150"},
    {n:"حلاقة دقن",d:"",p:"100"},
    {n:"شعر ودقن",d:"",p:"200"},
    {n:"حلاقة ولد",d:"",p:"70"},
    {n:"الصبغة",d:"",p:"50"},
    {n:"حلاقة عريس",d:"",p:"500"},
    {n:"تنظيف بشرة",d:"",p:"50"},
    {n:"تنظيف بشرة مع بخار",d:"",p:"100"}
  ],
  currency:"₺"
};
/* ======================================= */
document.title=CONFIG.name;
document.getElementById("name").textContent=CONFIG.name;
document.getElementById("tag").textContent=CONFIG.tagline;
document.getElementById("hours").textContent=CONFIG.hours;
document.getElementById("addr").textContent=CONFIG.address;
document.getElementById("ph").textContent=CONFIG.phoneShow;
["hours","addr"].forEach(function(i){var e=document.getElementById(i);if(!e.textContent.trim())e.parentNode.style.display="none"});
document.getElementById("foot").textContent="© 2026 "+CONFIG.name;
document.getElementById("wa").href="https://wa.me/"+CONFIG.phone;
var box=document.getElementById("svc"),sel=document.getElementById("sv");
CONFIG.services.forEach(function(s){
  var e=document.createElement("div");e.className="s";
  e.innerHTML='<div><b></b><small></small></div><span class="price"></span>';
  e.querySelector("b").textContent=s.n;e.querySelector("small").textContent=s.d;
  e.querySelector(".price").textContent=s.p+" "+CONFIG.currency;
  box.appendChild(e);
  var o=document.createElement("option");o.value=s.n;o.textContent=s.n+" – "+s.p+" "+CONFIG.currency;sel.appendChild(o);
});
/* ===== نظام الحجز (Firebase) ===== */
var FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",appId:""};
var BK={open:9,close:24,step:30,cap:2,days:14}; /* من 9 صباحاً حتى 12 ليلاً، حجزان لكل وقت */
var db=null;
try{if(FIREBASE_CONFIG.projectId){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}}catch(e){db=null}
var dEl=document.getElementById("d"),sl=document.getElementById("slots"),dn=document.getElementById("done"),pick="",counts={};
function pad(n){return (n<10?"0":"")+n}
function iso(x){return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
var now0=new Date(),mx=new Date();mx.setDate(mx.getDate()+BK.days);
dEl.min=iso(now0);dEl.max=iso(mx);dEl.value=iso(now0);
function times(){var a=[];for(var m=BK.open*60;m<BK.close*60;m+=BK.step)a.push(pad(Math.floor(m/60))+":"+pad(m%60));return a}
function draw(){
  sl.innerHTML="";var now=new Date(),td=dEl.value===iso(now);
  times().forEach(function(t){
    var past=false;if(td){var p=t.split(":"),x=new Date();x.setHours(+p[0],+p[1],0,0);past=x<=now}
    var full=(counts[t]||0)>=BK.cap,b=document.createElement("button");
    b.className="slot"+(t===pick?" on":"");b.textContent=t;
    if(full||past){b.disabled=true;b.className+=" off"}
    b.onclick=function(){pick=t;draw()};
    sl.appendChild(b);
  });
}
function load(){
  pick="";dn.style.display="none";counts={};
  if(!dEl.value||!db){draw();return}
  db.collection("slots").where("date","==",dEl.value).get().then(function(q){q.forEach(function(x){counts[x.data().time]=x.data().count});draw()}).catch(function(){draw()});
}
dEl.onchange=load;
document.getElementById("go").onclick=function(){
  var n=document.getElementById("n").value.trim(),d=dEl.value,btn=this;
  if(!n||!d||!pick){alert("الرجاء كتابة الاسم واختيار التاريخ والوقت");return}
  var t=pick;
  function ok(){
    var msg="مرحباً، أريد تأكيد حجز موعد\nالاسم: "+n+"\nالخدمة: "+sel.value+"\nالتاريخ: "+d+"\nالوقت: "+t;
    dn.innerHTML="✅ تم حجز موعدك. اضغط الزر لإرسال التفاصيل إلى الصالون:<br><a target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/"+CONFIG.phone+"?text="+encodeURIComponent(msg)+"\">إرسال عبر واتساب</a>";
    dn.style.display="block";
  }
  if(!db){ok();return}
  btn.disabled=true;
  var ref=db.collection("slots").doc(d+"_"+t.replace(":",""));
  db.runTransaction(function(tr){return tr.get(ref).then(function(s){
    var c=s.exists?s.data().count:0;
    if(c>=BK.cap)throw new Error("full");
    if(s.exists)tr.update(ref,{count:c+1});else tr.set(ref,{date:d,time:t,count:1});
  })}).then(function(){ok();var c=counts[t]||0;counts[t]=c+1;pick="";draw()})
  .catch(function(e){alert(e.message==="full"?"عذراً، هذا الوقت امتلأ للتو. اختر وقتاً آخر.":"تعذّر إتمام الحجز، حاول مرة أخرى.");load()})
  .then(function(){btn.disabled=false});
};
load();
</script>
</body>
